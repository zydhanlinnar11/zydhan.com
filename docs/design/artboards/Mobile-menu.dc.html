<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Menu mobile zydhan.com</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.glass{background:var(--glass);border:1px solid var(--glassline);box-shadow:var(--shadow),inset 0 1px 0 var(--glasshi);border-radius:24px}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
.glass{-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%)}
.scrim{-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
}
@media (prefers-reduced-transparency:reduce){.glass{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none}}
.bar-glass{background:var(--glassbar)}
.ov-glass{background:var(--glassov)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.bar-glass{-webkit-backdrop-filter:blur(10px) saturate(160%);backdrop-filter:blur(10px) saturate(160%)}.ov-glass{-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%)}}
@media (prefers-reduced-transparency:reduce){.ov-glass{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-transparency:reduce){.bar-glass{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none}}
.mesh{background:radial-gradient(circle 280px at 14% 14%,var(--m1),transparent 72%),radial-gradient(circle 300px at 90% 40%,var(--m2),transparent 72%),radial-gradient(circle 260px at 40% 74%,var(--m3),transparent 72%)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font:600 15px Inter,system-ui,sans-serif;text-decoration:none;box-sizing:border-box}
.btn-primary{background:var(--accent);color:var(--onaccent)}
.btn-ghost{background:var(--chip);color:var(--text);border:1px solid var(--line)}
a{color:inherit}
.item{display:flex;align-items:center;min-height:48px;padding:0 14px;font:600 18px Inter,system-ui,sans-serif;letter-spacing:-0.01em;text-decoration:none;border-radius:16px;color:var(--text)}
.seg{display:flex;gap:4px;padding:4px;background:var(--chip);border:1px solid var(--line);border-radius:16px}
.seg button{flex:1;min-height:44px;border:0;border-radius:12px;font:600 15px Inter,system-ui,sans-serif;cursor:pointer;background:transparent;color:var(--text)}
.lbl{font:500 14px Inter,system-ui,sans-serif;color:var(--muted)}
.bar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:1 1 0;height:60px;padding:0 4px;border-radius:999px;text-decoration:none;font:600 13px Inter,system-ui,sans-serif;color:var(--text);box-sizing:border-box}
.bar a.on{background:var(--accent);color:var(--onaccent)}
.bar a.tint{background:var(--accenttint);color:var(--accent)}
</style>
</helmet>
<div style="{{vars}} position:relative; overflow:hidden; width:390px; height:844px; box-sizing:border-box; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif">
  <div class="mesh" aria-hidden="true" style="position:absolute; inset:0"></div>

  <div aria-hidden="true" style="position:absolute; left:16px; right:16px; top:104px; display:flex; flex-direction:column; gap:18px">
    <h2 style="margin:0; font-size:38px; line-height:1.08; letter-spacing:-0.035em">Aku memimpin tim developer dan mendampingi klien sampai sistemnya dipakai.</h2>
    <p style="margin:0; font-size:16px; line-height:1.6">Zydhan Linnar Putra, backend engineer di Surabaya. Aku memimpin 20 developer di ITS dan mendampingi go-live SEVIMA PENA langsung di lokasi klien.</p>
    <span class="btn btn-primary">Lihat CV lengkap</span>
  </div>

  <div class="scrim" aria-hidden="true" style="position:absolute; inset:0; background:var(--scrim)"></div>

  <div style="position:relative; padding:16px; display:flex; flex-direction:column; gap:12px">
    <div class="glass bar-glass" style="border-radius:999px; padding:6px 6px 6px 8px; display:flex; align-items:center; justify-content:space-between">
      <img src="/_blob/76f354f1e0e572759e72c25b3ac8ee54" alt="Zydhan" width="40" height="40" style="width:40px; height:40px; border-radius:50%; display:block">
      <a href="Mobile.dc.html" aria-label="Tutup menu" style="min-height:44px; min-width:44px; border-radius:999px; border:1px solid var(--line); background:var(--chip); color:var(--text); display:inline-flex; align-items:center; justify-content:center; text-decoration:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
    </div>

    <div class="glass ov-glass" style="padding:12px 12px 20px; display:flex; flex-direction:column; gap:20px">
      <nav aria-label="Menu utama" style="display:flex; flex-direction:column; gap:2px">
        <a class="item" href="Mobile.dc.html" aria-current="page" style="background:var(--accenttint); color:var(--accent)">Home</a>
        <a class="item" href="CV.dc.html">CV</a>      </nav>
      <div style="display:flex; flex-direction:column; gap:14px; padding:0 8px">
        <div style="display:flex; flex-direction:column; gap:8px">
          <span class="lbl">Bahasa</span>
          <div class="seg" role="group" aria-label="Bahasa">
            <button aria-pressed="true" style="background:var(--accent); color:var(--onaccent)">Indonesia</button>
            <button aria-pressed="false">English</button>
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px">
          <span class="lbl">Tema</span>
          <div class="seg" role="group" aria-label="Tema">
            <button aria-pressed="{{terangOn}}" style="{{terangStyle}}">Terang</button>
            <button aria-pressed="{{gelapOn}}" style="{{gelapStyle}}">Gelap</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav class="glass bar-glass bar" aria-label="Aksi cepat" style="position:absolute; left:16px; right:16px; bottom:16px; height:72px; padding:6px; border-radius:999px; display:flex; gap:4px; box-sizing:border-box">
    <a class="tint" href="Mobile.dc.html" aria-expanded="true" aria-label="Tutup navigasi">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <span>Tutup</span>
    </a>
    <a href="mailto:zydhanlinnar11@gmail.com?subject=Proyek%20freelance" aria-label="Hubungi lewat email">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/></svg>
      <span>Hubungi</span>
    </a>
    <a class="on" href="CV.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/></svg>
      <span>Lihat CV</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["terang","gelap"],"default":"terang"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'gelap';
    const t = dark ? {
      bg:'#12141C', text:'#F1EEEA', muted:'#BDBAB8', glass:'rgba(24,27,38,0.62)', glassline:'rgba(255,255,255,0.20)', glasshi:'rgba(255,255,255,0.16)',
      shadow:'0 12px 40px rgba(0,0,0,0.45)', solid:'#1E212C', accent:'#BFDDE1', accenttint:'rgba(191,221,225,0.14)', onaccent:'#12141C', chip:'rgba(255,255,255,0.08)',
      line:'rgba(255,255,255,0.13)', focus:'#DAEAED', scrim:'rgba(8,9,14,0.30)',
      m1:'#2E5560', m2:'#7A5440', m3:'#46413C'
    } : {
      bg:'#EEF3F4', text:'#12141C', muted:'#46413C', glass:'rgba(255,255,255,0.58)', glassline:'rgba(255,255,255,0.85)', glasshi:'rgba(255,255,255,0.9)',
      shadow:'0 0 0 1px rgba(18,20,28,0.08), 0 12px 40px rgba(70,65,60,0.16)', solid:'#FFFFFF', accent:'#1F6F7A', accenttint:'rgba(31,111,122,0.12)', onaccent:'#FFFFFF', chip:'rgba(18,20,28,0.07)',
      line:'rgba(18,20,28,0.12)', focus:'#1F6F7A', scrim:'rgba(18,20,28,0.16)',
      m1:'#BFDDE1', m2:'#D7AB8E', m3:'#A19E9D'
    };
    const vars = Object.keys(t).map((k) => '--' + k + ':' + t[k] + ';').join(' ') + ' --glassbar:' + (dark ? 'rgba(24,27,38,0.30)' : 'rgba(255,255,255,0.24)') + ';' + ' --glassov:' + (dark ? 'rgba(24,27,38,0.48)' : 'rgba(255,255,255,0.44)') + ';';
    const on = 'background:var(--accent); color:var(--onaccent);';
    return {
      vars,
      terangOn: !dark,
      gelapOn: dark,
      terangStyle: dark ? '' : on,
      gelapStyle: dark ? on : ''
    };
  }
}
</script>
</body>
</html>
