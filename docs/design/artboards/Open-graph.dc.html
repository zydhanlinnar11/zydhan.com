<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kartu Open Graph zydhan.com</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
.glass{background:var(--glass);border:1px solid var(--glassline);box-shadow:var(--shadow),inset 0 1px 0 var(--glasshi);border-radius:44px}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
.glass{-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%)}
}
.mesh{background:radial-gradient(circle 420px at 12% 18%,var(--m1),transparent 72%),radial-gradient(circle 460px at 90% 24%,var(--m2),transparent 72%),radial-gradient(circle 380px at 62% 96%,var(--m3),transparent 72%)}
</style>
</helmet>
<div style="{{vars}} position:relative; overflow:hidden; width:1200px; height:630px; box-sizing:border-box; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif">
  <div class="mesh" aria-hidden="true" style="position:absolute; inset:0"></div>

  <div class="glass" style="position:absolute; left:56px; top:56px; right:56px; bottom:56px; padding:56px; display:flex; flex-direction:column; justify-content:space-between; box-sizing:border-box">
    <div style="display:flex; align-items:center; gap:36px">
      <img src="/_blob/76f354f1e0e572759e72c25b3ac8ee54" alt="" width="168" height="168" style="width:168px; height:168px; border-radius:50%; display:block; flex:0 0 auto">
      <div style="display:flex; flex-direction:column; gap:12px; min-width:0">
        <h1 style="margin:0; font-size:72px; line-height:1.02; letter-spacing:-0.04em; font-weight:700">Zydhan Linnar Putra</h1>
        <p style="margin:0; font-size:30px; line-height:1.3; color:var(--muted)">Backend engineer di Surabaya</p>
      </div>
    </div>
    <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:32px">
      <p style="margin:0; font-size:32px; line-height:1.3; max-width:760px; letter-spacing:-0.01em">Memimpin tim developer dan mendampingi klien sampai sistemnya dipakai.</p>
      <span style="font-size:30px; font-weight:600; color:var(--accent)">zydhan.com</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["terang","gelap"],"default":"terang"},"$preview":{"width":1200,"height":630}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'gelap';
    const t = dark ? {
      bg:'#12141C', text:'#F1EEEA', muted:'#BDBAB8', glass:'rgba(24,27,38,0.62)', glassline:'rgba(255,255,255,0.20)', glasshi:'rgba(255,255,255,0.16)',
      shadow:'0 12px 40px rgba(0,0,0,0.45)', accent:'#BFDDE1',
      m1:'#2E5560', m2:'#7A5440', m3:'#46413C'
    } : {
      bg:'#EEF3F4', text:'#12141C', muted:'#46413C', glass:'rgba(255,255,255,0.58)', glassline:'rgba(255,255,255,0.85)', glasshi:'rgba(255,255,255,0.9)',
      shadow:'0 0 0 1px rgba(18,20,28,0.08), 0 12px 40px rgba(70,65,60,0.16)', accent:'#1F6F7A',
      m1:'#BFDDE1', m2:'#D7AB8E', m3:'#A19E9D'
    };
    const vars = Object.keys(t).map((k) => '--' + k + ':' + t[k] + ';').join(' ');
    return { vars };
  }
}
</script>
</body>
</html>
