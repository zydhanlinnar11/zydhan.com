name: Deploy to GitHub Pages

# Production deploys run on every push to main and use an empty BASE_PATH.
# A manual dispatch from another branch (for example preview) still builds the
# github.io/zydhan.com preview with BASE_PATH=/zydhan.com.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # main is served from the custom domain at /, while a manual preview deploy
      # from another branch is served from https://<owner>.github.io/zydhan.com.
      - name: Choose base path
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/zydhan.com" >> "$GITHUB_ENV"
          fi

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Note: main includes static/CNAME (zydhan.com), so the production artifact is bound
# to the custom domain. The preview branch intentionally omits the file so the
# github.io/zydhan.com preview does not redirect to the live domain.
